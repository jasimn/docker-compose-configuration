version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: examplepassword
      MYSQL_DATABASE: simpleapp
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db:/docker-entrypoint-initdb.d  # auto-run your SQL init script
    networks:
      - appnet

  backend:
    build: ./backend
    container_name: backend_service
    restart: always
    depends_on:
      - mysql
    environment:
      PORT: 3000
      DB_HOST: mysql        # matches service name
      DB_USER: root
      DB_PASS: examplepassword
      DB_NAME: simpleapp
      DB_PORT: 3306
    ports:
      - "3000:3000"
    networks:
      - appnet

  frontend:
    build: ./frontend
    container_name: frontend_service
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - appnet

networks:
  appnet:

volumes:
  mysql_data:
